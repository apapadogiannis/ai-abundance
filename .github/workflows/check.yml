name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"   # first of each month

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read the record out of the manuscript source again
        run: ./run_all.sh

      - name: Verify the stored record is the one the manuscript gives
        # llms.txt exists from version 1.0, once the archive DOI is known.
        run: python3 check_outputs.py --no-run $([ -f llms.txt ] && echo --also llms.txt)
