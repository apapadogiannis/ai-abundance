what = "This is a paper record, not a replication package: the paper is theoretical and has no data and no computation to reproduce. The paper argues that AI can make many goods and services cheap to produce (AI technological abundance, ATA) without making an essential standard of living broadly affordable (AI economic abundance, AEA), because scarcity and its rents move to five layers: physical resources, infrastructure, capabilities, institutions and jurisdictions. The record holds the paper's definitions, the five layers with the prediction for each, the model, and Table 1 as data, all read out of the manuscript source. One added page, which goes beyond the article, says how each prediction could be found wrong. The manuscript is in paper/."
