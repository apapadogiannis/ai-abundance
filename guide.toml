[[table]]
file = "table1.csv"
what = "Table 1 of the paper, one row per actor or industry: the expected direction of each layer's contribution to rent income, and the net direction. Schematic and conjectural; the article says the entries are not forecasts."
[table.columns]
id = "identifier of the row: the panel letter and the position in the panel, A1 to E4"
panel = "panel of the table, A to E"
panel_title = "title of the panel, as printed"
actor = "actor or industry, as printed in bold in the table"
note = "the small print under the actor's name, as printed; empty where the table has none"
physical = "sign of the contribution of layer 1, physical, to the change in the actor's rent income: ++, +, 0, - or --"
infrastructural = "the same for layer 2, infrastructural"
capabilities = "the same for layer 3, capabilities"
institutional = "the same for layer 4, institutional"
jurisdictional = "the same for layer 5, jurisdictional"
net = "the implied direction of the change in the actor's total rent income, as printed; it cannot be recomputed from the five signs, because their sizes are not given"
tests = "the tests of outputs/tests.csv that use this row, separated by a space; empty for the 14 rows that no test uses"

[[table]]
file = "table1_signs.csv"
what = "The same table with one row per actor and column, for filtering: 24 actors times five layers and the net column."
[table.columns]
id = "identifier of the actor's row in table1.csv"
actor = "actor or industry"
column = "physical, infrastructural, capabilities, institutional, jurisdictional, or net"
layer_number = "1 to 5 for a layer; empty for the net column"
sign = "the sign: ++, +, 0, - or --"
score = "the sign as a whole number from 2 to -2, for sorting only; not a measured size and not to be summed"

[[table]]
file = "layers.csv"
what = "The five layers of scarcity, in the article's words."
[table.columns]
layer = "number of the layer, 1 to 5"
name = "name of the layer"
holds = "what the layer consists of, from the article's list of the five layers, citations removed"
prediction = "the sentence that follows the word 'Prediction:' in the article's section on that layer"

[[table]]
file = "claims.csv"
what = "The three central claims, as listed in the introduction."
[table.columns]
claim = "number of the claim, 1 to 3"
title = "the claim in a few words, as printed in bold"
text = "the article's explanation of the claim"

[[table]]
file = "definitions.csv"
what = "Seven terms of the paper, each with the passage of the article that defines it."
[table.columns]
term = "the term"
short = "its abbreviation, where the article uses one"
section = "the section of the article the passage is taken from"
text = "the passage, word for word, citations removed; it can be a phrase, and it can refer to text that stands before it in the article"

[[table]]
file = "model.csv"
what = "The model of the section 'A compact mathematical formulation': six equations, the definition of AEA, the proposition and its proof."
[table.columns]
item = "Equation 1 to 6, Definition 1, Proposition 1, or its proof"
name = "for an equation, a label given by the record; for the definition and the proposition, the title the article gives them; empty for the proof"
form = "latex for an equation; text with LaTeX mathematics for the others"
content = "the equation or the statement, from the manuscript source"

[[table]]
file = "symbols.csv"
what = "Glossary of the symbols. Written for this record from the article's definitions; not a passage of the article."
[table.columns]
symbol = "short name of the symbol"
latex = "the symbol in LaTeX, in a form that occurs in the manuscript source"
meaning = "what it stands for"
introduced_in = "where the article introduces it"

[[table]]
file = "tests.csv"
what = "Beyond the article: for each prediction, how it could be found wrong. Baselines 2022 and 2026; first reading on data for 2027, final reading on data for 2032. No reading has been taken."
[table.columns]
id = "identifier of the test, T1 to T11"
refers_to = "what the test is about: layer:N for the prediction on layer N; claim:central for the central claim as stated in the introduction; table:X<Y for two rows of Table 1 where the net sign of X is lower than that of Y"
article_says = "the sentence or the net signs of the article that the test refers to, taken from the other tables"
measure = "what would be measured"
public_sources = "the kind of public source it can be read from; no series has been chosen"
baseline = "the first year the change is measured from, 2022; for T7 to T11 an average of three years ending then"
second_baseline = "the second year the change is measured from, 2026, the year the tests were written; the verdict is taken from this one"
first_reading = "the year of the data for the first reading"
final_reading = "the year of the data for the final reading, at which the verdict is taken"
counts_against = "the outcome at the final reading that would count against the paper"
does_not_count = "an outcome that looks similar and would not count against the paper, with the reason"
